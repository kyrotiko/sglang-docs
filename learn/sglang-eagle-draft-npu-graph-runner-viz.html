<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGLang NPU 上的 EAGLE draft 图：EAGLEDraftNpuGraphRunner 是干嘛的</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#fafafa;color:#222;line-height:1.6}
header{padding:14px 24px;background:#1f2937;color:#fff}
header h1{margin:0;font-size:19px}
nav.steps{display:flex;flex-wrap:wrap;gap:6px;padding:10px 24px;background:#fff;border-bottom:1px solid #ddd}
nav.steps button{border:1px solid #bbb;background:#fff;border-radius:4px;padding:4px 12px;cursor:pointer;font-size:14px}
nav.steps button[aria-current="step"]{background:#1f2937;color:#fff;border-color:#1f2937}
main{padding:14px 24px;max-width:1320px}
h2{margin:4px 0 8px;font-size:18px}
h3{font-size:15px;margin:14px 0 6px}
.desc{background:#fff;border-left:4px solid #1f2937;padding:8px 14px;margin-bottom:12px}
.warn{background:#fff7ed;border-left:4px solid #c2410c;padding:8px 14px;margin:10px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar button{padding:5px 14px;font-size:14px;cursor:pointer;background:#fff;border:1px solid #888;border-radius:4px}
.bar button[aria-pressed="true"]{background:#1f2937;color:#fff}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
code{background:#eef;padding:0 4px;border-radius:3px;font-size:13px}
.loc{font-family:Consolas,monospace;font-size:12px;color:#1d4ed8}
.note{font-size:13px;color:#555}
.info{background:#fff8e1;border:1px solid #e8c86a;border-radius:6px;padding:8px 12px;margin:8px 0;min-height:60px}
/* 架构图 */
.arch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 18px;align-items:start;max-width:1100px}
.abox{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:#fff;border:2px solid var(--c);border-radius:8px;padding:8px 10px;font-size:13px}
.abox b{color:var(--c);font-size:14px;display:block}
.abox small{font-family:Consolas,monospace;font-size:11px;color:#666}
.abox.sel{background:#fffbea;box-shadow:0 0 0 3px #f59e0b}
.abox.dash{border-style:dashed}
.span3{grid-column:1/4}
.span2{grid-column:2/4}
.down{text-align:center;font-size:18px;color:#888;line-height:1}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:#eee;color:#333;margin-top:3px}
/* 草稿树 */
.tree{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;overflow-x:auto}
circle.tnode{fill:#fff;stroke:#999;stroke-width:1.5}
.tree text{font-size:11px;fill:#333;text-anchor:middle}
.tedge{stroke:#bbb;stroke-width:1.5;fill:none}
.n-on circle.tnode{stroke:#c2410c;stroke-width:2.5;fill:#fff7ed}
.n-on text{fill:#7c2d12;font-weight:700}
.n-hide{opacity:.12}
.n-acc circle.tnode{fill:#dcfce7;stroke:#15803d;stroke-width:2.5}
.n-acc text{fill:#14532d;font-weight:700}
.n-rej{opacity:.35}
/* buffer 表 */
.btbl{border-collapse:collapse;font-size:13px;margin:6px 0;background:#fff}
.btbl td,.btbl th{border:1px solid #ddd;padding:4px 10px;text-align:center;font-family:Consolas,monospace}
.btbl th{background:#f3f4f6;font-family:inherit}
.btbl .hl{background:#fff7ed}
.btbl .pad{color:#999}
/* DP 投票 */
.ranks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rank{border:2px solid #999;border-radius:8px;padding:6px 10px;font-size:13px;background:#fff;min-width:120px;text-align:center}
.rank b{display:block;font-size:12px}
.rank.g{border-color:#15803d}.rank.e{border-color:#c2410c}
.minres{border:2px solid #1f2937;border-radius:8px;padding:8px 14px;font-size:14px;background:#fffbea}
/* 直觉条形图 + token 流 */
.mb{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.mblab{width:200px;font-size:13px;text-align:right}
.mbtrack{position:relative;height:26px;background:#f1f5f9;border-radius:4px;width:520px;max-width:70%}
.mbw{position:absolute;left:0;top:0;height:100%;background:#2563eb;border-radius:4px 0 0 4px}
.mbc{position:absolute;top:0;height:100%;background:#c2410c}
.mbval{font-size:13px;color:#555}
.toks{display:flex;gap:4px;flex-wrap:wrap;align-items:stretch;margin:8px 0}
.tok{min-width:40px;padding:5px 7px;border-radius:6px;border:2px solid #999;background:#fff;text-align:center;font-size:15px}
.tok small{display:block;font-size:10px;color:#666;font-family:inherit}
.tok.ctx{background:#f1f5f9;border-color:#94a3b8}
.tok.dr{border-color:#c2410c;background:#fff7ed}
.tok.vfy{border-color:#2563eb}
.tok.ok{border-color:#15803d;background:#dcfce7}
.tok.bad{border-color:#c2410c;background:#fee2e2}
.tok.fix{border-color:#15803d;background:#ecfdf5}
.tok.root{border-color:#7e22ce;background:#f5f3ff}
.ctrs{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}
.ctr{border:1px solid #bbb;border-radius:8px;padding:4px 14px;background:#fff;font-size:13px;text-align:center;min-width:96px}
.ctr b{font-size:18px;display:block}
.ctr .cl{color:#666;font-size:12px}
.ctr.hot{border-color:#c2410c;background:#fff7ed}
table.cmp{border-collapse:collapse;font-size:14px;margin:8px 0;width:100%;max-width:1150px}
table.cmp td,table.cmp th{border:1px solid #ddd;padding:6px 10px;text-align:left;vertical-align:top}
table.cmp th{background:#f3f4f6}
</style>
</head>
<body>
<header><h1>EAGLEDraftNpuGraphRunner：昇腾 NPU 上，EAGLE 投机解码的"草稿步"是怎么被一张图跑完的</h1></header>
<nav class="steps" id="nav" aria-label="页面导航"></nav>
<main>
  <h2 id="title" tabindex="-1"></h2>
  <div id="stage"></div>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS = [];

// ---------- Tab 1：投机解码是什么 ----------
const SCTX = ['今','天','天'], SROOT = '气', SDRAFT = ['很','好','，'], SFIX = '真';
const SDSTEPS = [
 {t:'先看痛点：一个 token 一次大前向', d:'大模型生成文本是<b>自回归</b>的：第 n+1 个 token 依赖第 n 个的结果，只能一个一个来——注意，串行的原因是<b>"不知道下一个 token 是什么"</b>，不是"模型算不了多个"（第 3 步会用到这一点）。而一次 decode 前向的大头是<b>把几十 GB 权重从显存搬进计算单元</b>（memory-bound），搬一遍的时间跟"算几个 token"关系不大。batch 小的时候 GPU 算力大量闲置，时间全花在一趟一趟搬权重上——上面的条形图就是这个意思。'},
 {t:'让小模型先猜：3 次小前向', d:'投机解码请一个"小模型"（draft，通常只有一两层，参数是大模型的零头）<b>自回归连猜 3 个 token</b>："很"、"好"、"，"。小模型一次前向比大模型快几个数量级，猜错也不罚——下一步大模型会亲自验收，最坏只是白跑几次小前向。'},
 {t:'大模型一次前向，把 3 笔账一起验', d:'<b>关键认知：大模型不是"一次只会吐一个 token"的机器。</b>Transformer 本质是个函数：喂一段 token，输出<b>每个位置</b>"下一个 token"的分布——训练时就是这么全位置并行算 loss 的；decode 每次只喂 1 个、只读最后 1 行，是"省着用"，不是能力上限。所以"很/好/，"虽然是大模型没生成过的、draft 猜的 token，照样能喂：模型对输入<b>没有身份校验</b>，只做计算。<br>本轮前向的实际输入是 <b>4 个新 token：气 + 很 好 ，</b>——"气"是上一轮刚被采样出来的，从没作为输入进过大模型（KV cache 里没有它），这轮要顺带写入；[今 天 天] 的 KV 已缓存，attention 直接读、不用重算。产出的 4 行预测见下方表格，验收依据就在里面。'},
 {t:'对账：接受 2 个、修正 1 个', d:'拿前向输出逐行验收：第 1 行的分布说下一个是"很"✓、第 2 行说"好"✓、第 3 行说"真"——draft 猜的"，"✗。规则：<b>接受猜中的前缀，一错就停</b>，并采纳大模型在第 3 行的答案"真"。猜错不会产出错字，只是这一轮少赚。'},
 {t:'本轮账本：1 次大前向 = 3 个 token', d:'普通 decode 产出 3 个 token 要 <b>3 次大前向</b>；这里只要 <b>1 次</b>，外加几次可忽略的小前向。加速比 ≈ 平均每轮接受长度 + 1（修正位保底 1 个：被拒的那行 logits 永远给出了一个正确 token）：全中一轮得 3+1=4 个，全不中也有 1 个。draft 和 target 越"合拍"，长期加速比越高——实际部署里平均一轮拿 2~3 个 token 很常见。下一轮从"真"重新开始（它成为新的根，同样要在下轮前向里写入 KV）。'},
];
let sdStep = 0;
function memBars() {
  const W = 100, C = 2, MAX = W + 8 * C;
  const rows = [[1, '普通 decode：算 1 个 token'], [4, '投机验证：一次算 4 个'], [8, '投机验证：一次算 8 个']];
  return rows.map(([n, lab]) => `<div class="mb"><div class="mblab">${esc(lab)}</div>` +
    `<div class="mbtrack" role="img" aria-label="${esc(lab)}，读权重 100 份、计算 ${n * C} 份（示意）">` +
    `<div class="mbw" style="width:${W / MAX * 100}%" title="读一遍模型权重：固定的大头"></div>` +
    `<div class="mbc" style="left:${W / MAX * 100}%;width:${n * C / MAX * 100}%" title="算 ${n} 个 token：很小，随 token 数增长"></div>` +
    `</div><div class="mbval">总时长 ≈ ${W + n * C}</div></div>`).join('');
}
function sdToks(i) {
  let h = '<div class="toks">';
  SCTX.forEach(c => h += `<div class="tok ctx">${esc(c)}<small>context·KV已缓存</small></div>`);
  h += `<div class="tok root">${esc(SROOT)}<small>上轮产出·待入KV</small></div>`;
  if (i >= 1) SDRAFT.forEach((d, k) => {
    let cls = 'dr', mark = 'draft 猜';
    if (i === 2) { cls = 'dr vfy'; mark = '待验'; }
    if (i >= 3) { cls = k < 2 ? 'ok' : 'bad'; mark = k < 2 ? '✓ 接受' : '✗ 猜错'; }
    h += `<div class="tok ${cls}">${esc(d)}<small>${mark}</small></div>`;
  });
  if (i >= 3) h += `<div class="tok fix">${esc(SFIX)}<small>大模型修正</small></div>`;
  return h + '</div>';
}
function logitsTable(i) {
  if (i < 2) return '';
  const rows = [
    {in:SROOT, pred:'很', use:'验收 draft 第 1 猜"很"', v:''},
    {in:'很', pred:'好', use:'验收 draft 第 2 猜"好"', v:''},
    {in:'好', pred:'真（≠ draft 猜的"，"）', use:'验收第 3 猜；被拒时这行就是修正 token"真"的出处', v:''},
    {in:'，', pred:'（下一个）', use:'本轮作废："，"被拒不落盘', v:'pad'},
  ];
  return `<h3>本轮一次前向的输出：每个输入位置各一行"下一个 token"分布（即 logits 矩阵，vocab 维已略）</h3>
  <table class="btbl"><tr><th>本轮输入的 token</th><th>该行预测的"下一个"</th><th>用途</th></tr>` +
  rows.map((r, k) => `<tr class="${i >= 3 ? (k < 3 ? 'hl' : 'pad') : (k < 3 ? '' : 'pad')}"><td>${esc(r.in)}${k === 0 ? '<small style="color:#7e22ce">（根，顺带写 KV）</small>' : ''}</td><td>${esc(r.pred)}</td><td style="font-family:inherit">${esc(r.use)}</td></tr>`).join('') +
  `</table><p class="note">因果注意力保证每个位置的预测只看它左边的 token——所以把 draft 猜的 token 接在后面，不会污染任何位置的预测，每行结果都等价于"模型自己一步步走到这里再预测"。这就是投机解码<b>无损</b>的根源。[今 天 天] 的 KV 已缓存，不进本轮前向。</p>`;
}
function sdCounters(i) {
  const v = [[0,0,0],[0,3,0],[1,3,0],[1,3,3],[1,3,3]][i];
  const box = (n, lab, hot) => `<div class="ctr ${hot ? 'hot' : ''}"><b>${n}</b><div class="cl">${lab}</div></div>`;
  return `<div class="ctrs">` + box(v[0], '大模型前向', i === 2) + box(v[1], 'draft 前向', i === 1) + box(v[2], '产出 token', i === 3) + `</div>`;
}
TABS.push({nav:'① 投机解码是什么', title:'① 从零讲投机解码：小模型猜、大模型验，为什么又快又不掉精度',
render(){
  return `<div class="desc">一句话：<b>让一个小模型先把接下来的几个 token 猜出来，大模型一次前向把这几笔账一起验掉</b>。猜中的直接采纳，猜错的位置用大模型的答案修正。
    这就是"投机"的含义——赌 draft 猜得八九不离十，赌赢了省大模型前向的次数。先建立两个直觉，再看一轮完整流程。</div>
  <h3>直觉 1：为什么"多验几个 token"几乎是免费的</h3>
  ${memBars()}
  <div class="legend" style="font-size:13px"><span style="display:inline-flex;align-items:center;gap:4px;margin-right:14px"><i style="width:14px;height:14px;background:#2563eb;display:inline-block"></i>读一遍模型权重（固定的大头）</span>
    <span style="display:inline-flex;align-items:center;gap:4px"><i style="width:14px;height:14px;background:#c2410c;display:inline-block"></i>算这些 token（很小，随 token 数增长）</span></div>
  <p class="note">示意数字："读一遍权重"记为 100，每算一个 token 记为 2。decode 阶段真实开销以搬权重为主，所以一次前向算 1 个 token 和算 8 个 token 差距很小——<b>这就是投机解码全部收益的来源：把"串行 N 次搬运"压成"1 次搬运 + 顺手多算"</b>。</p>
  <h3>直觉 2：一轮投机解码长什么样（逐步）</h3>
  <div class="bar"><button id="sdPrev">← 上一步</button><button id="sdNext">下一步 →</button><span id="sdCnt" aria-live="polite"></span></div>
  <div id="sdToks"></div>
  <div id="sdLogits"></div>
  <div id="sdCtr"></div>
  <div class="info" id="sdInfo" aria-live="polite"></div>
  <h3>几个常见问题</h3>
  <table class="cmp">
    <tr><th>猜错了怎么办？</th><td>不会产出错字：每个位置都要由大模型算出的分布复核，从第一个不一致的位置起全部丢弃，并用大模型的答案顶上。最坏一轮"只赚 1 个"（修正位保底），相当于退回普通 decode，外加几次小前向的浪费。</td></tr>
    <tr><th>真的不掉精度？</th><td>是。接受/拒绝规则（rejection sampling）保证最终 token 序列的分布与大模型自己一步步生成的分布<b>完全相同</b>——它只是"把必须串行的生成变成可以并行的校对"，不改变生成内容。</td></tr>
    <tr><th>大模型是自回归的，怎么能把"猜的"token 喂给它？</th><td>自回归是<b>使用方式</b>，不是计算上限。Transformer 是"给序列 → 每个位置各出一个'下一个 token'分布"的函数（训练时全位置并行算 loss）；decode 只喂 1 个、只读最后 1 行是省着用——串行卡在"不知道下一个是什么"，不卡在"算不了多个"。模型对输入 token <b>没有身份校验</b>，draft 拼的前文照算不误。</td></tr>
    <tr><th>"每个位置的下一个 token"是怎么算出来的？</th><td>每层 transformer 对<b>每个</b>输入位置输出一个向量（[seq_len, hidden] 矩阵），最后一层经 lm_head 投影成 vocab 维分布：一次前向、所有行同时出现。"验收"不是新机制——<b>就是从同一次前向的 logits 矩阵里多读几行</b>。因果注意力保证位置 i 只看 ≤ i 的 token，所以每行都等价于"模型自己走到这里会怎么预测"。</td></tr>
    <tr><th>draft 小模型哪来的？</th><td>看方案：可以是独立小模型，也可以像 EAGLE、DeepSeek-MTP 那样从大模型蒸馏/附着出来的"一两层小尾巴"。SGLang 里用 <code>--speculative-algorithm</code> 选方案，<code>--speculative-num-steps / --speculative-eagle-topk / --speculative-num-draft-tokens</code> 定每次猜多大树。</td></tr>
    <tr><th>和本页主角什么关系？</th><td>EAGLE 是其中对单请求延迟最友好的一种：draft 直接吃大模型的 hidden state、每步猜 topk 个候选长成<b>树</b>、一次验证多条路径——<b>就在下一页展开</b>。而 <code>EAGLEDraftNpuGraphRunner</code> 只负责"draft 连跑几步"这一小段在 NPU 上的图化。</td></tr>
  </table>`;
},
after(){
  const draw = () => {
    sdStep = Math.max(0, Math.min(SDSTEPS.length - 1, sdStep));
    const s = SDSTEPS[sdStep];
    document.getElementById('sdToks').innerHTML = sdToks(sdStep);
    document.getElementById('sdLogits').innerHTML = logitsTable(sdStep);
    document.getElementById('sdCtr').innerHTML = sdCounters(sdStep);
    document.getElementById('sdCnt').textContent = `步骤 ${sdStep + 1} / ${SDSTEPS.length}`;
    document.getElementById('sdInfo').innerHTML = `<b>${esc(s.t)}</b><div>${s.d}</div>`;
  };
  document.getElementById('sdNext').onclick = () => { sdStep++; draw(); };
  document.getElementById('sdPrev').onclick = () => { sdStep--; draw(); };
  draw();
}});

// ---------- Tab 1：EAGLE 投机解码（先讲清它服务的是什么流程） ----------
const TOPK = 2, NSTEP = 3;   // 演示参数：draft 模型跑 3 步，每步选 2 个候选
const LVL_Y = [40, 130, 220, 310];
// 建一棵 1+2+4+8 的草稿树，叶子均分横坐标，父节点取子节点中点
const NODES = [];
(function build() {
  let id = 0;
  const mk = (lvl, parent, label) => { const n = {id:id++, lvl, parent, label, kids:[]}; NODES.push(n); return n; };
  const root = mk(0, null, 't₀');
  let prev = [root];
  for (let l = 1; l <= NSTEP; l++) {
    const next = [];
    prev.forEach(p => { for (let k = 0; k < TOPK; k++) { const c = mk(l, p, p.label + 'ab'[k]); p.kids.push(c); next.push(c); } });
    prev = next;
  }
  const leaves = NODES.filter(n => n.lvl === NSTEP);
  leaves.forEach((n, i) => n.x = 70 + i * (760 / (leaves.length - 1)));
  for (let l = NSTEP - 1; l >= 0; l--)
    NODES.filter(n => n.lvl === l).forEach(n => n.x = (n.kids[0].x + n.kids[n.kids.length - 1].x) / 2);
  NODES.forEach(n => n.y = LVL_Y[n.lvl]);
})();
const TSTEPS = [
 {vis:0, t:'起点：一次普通的 target decode', d:'大模型（target）刚算出第 n 个 token <code>t₀</code>，同时得到它倒数第二层的 hidden state。正常流程下一步又是一次完整前向。EAGLE 接着上一页的思路：<b>小 draft 模型连猜几步、target 一次验证</b>，但比上一页的线性版本更进一步——先看它猜的形状。'},
 {vis:1, t:'draft-extend：先猜出第 1 层的 2 个候选', d:'注意：这一步发生在 draft-extend 阶段（<b>循环之前、不在这张 draft 图里</b>）——draft 模型吃 target 的 hidden state 跑一次，从词表里选 topk=2 个最可能的下一个 token（a、b）。它给出的候选存进 spec_info，正是循环第一轮"收进树"的那份输入。'},

function treeSvg(s) {
  const visLvl = s.vis, showAll = s.all, acc = (s.acc || '').split(',').filter(Boolean);
  let edges = '', nodes = '';
  NODES.forEach(n => {
    if (n.parent) edges += `<line class="tedge${showAll || n.lvl <= visLvl ? '' : ' n-hide'}" x1="${n.parent.x}" y1="${n.parent.y}" x2="${n.x}" y2="${n.y}"/>`;
  });
  NODES.forEach(n => {
    const shown = showAll || n.lvl <= visLvl;
    let cls = shown ? '' : ' n-hide';
    if (shown && s.acc) cls = acc.includes(n.label) ? ' n-acc' : ' n-rej';
    else if (shown && n.lvl === visLvl && !showAll) cls = ' n-on';
    nodes += `<g class="${cls}" role="img" aria-label="草稿树节点 ${n.label}"><circle class="tnode" cx="${n.x}" cy="${n.y}" r="17"/><text x="${n.x}" y="${n.y + 4}">${esc(n.label)}</text></g>`;
  });
  return `<svg viewBox="0 0 900 348" width="100%" height="348" style="min-width:720px">${edges}${nodes}
    <text x="860" y="${LVL_Y[0] + 5}" font-size="11" fill="#888">target 出</text>

}

function bufTable(stepIdx) {
  // stepIdx: 演示进度（rep 阶段第 2、4 步之后分别展示不同状态）

  ];
  if (stepIdx >= 3) rows[0].hl = rows[1].hl = 1;       // 从"构造列表"步起高亮两份 update 列表
  if (stepIdx >= 5) rows.forEach(r => r.hl = 1);       // 回放完成后再看第 1 次前向
  return `<table class="btbl"><tr><th>图内的前向</th><th>请求A</th><th>请求B</th><th>空槽</th><th>空槽</th><th>长度从哪来</th></tr>` +

    `</table><p class="note">每行就是喂给 attention 的 <code>actual_seq_lengths_kv</code>（num_steps=3 → 图内 2 次前向，最后一轮循环只选 token 不前向）。NPU 图里这份数组录制时被烧死，所以<b>每一行</b>都要每次 replay 前 <code>graph.update</code> 重绑——这正是原 NPU 子类 <code>_replay_graph</code> override 存在的理由。空槽补 0 表示"这行没有请求，attention 别看"。</p>`;
}

after(){
  const draw = () => {
    const steps = RLEN[cPhase];
    cStep = Math.max(0, Math.min(steps.length - 1, cStep));
    const s = steps[cStep];
    document.getElementById('cCnt').textContent = `步骤 ${cStep + 1} / ${steps.length}`;
    document.getElementById('cInfo').innerHTML = `<b>${esc(s.t)}</b> &nbsp;<span class="loc">${esc(s.loc)}</span><div>${s.d}</div>`;
    document.getElementById('cBuf').innerHTML = cPhase === 'rep' ? `<h3>attention 看到的 KV 长度（每行一次图内前向）</h3>` + bufTable(cStep) : '';
  };
  document.querySelectorAll('[data-cp]').forEach(b => b.onclick = () => {
    cPhase = b.dataset.cp; cStep = 0;
    document.querySelectorAll('[data-cp]').forEach(x => x.setAttribute('aria-pressed', x === b));
    draw();
  });
  document.getElementById('cNext').onclick = () => { cStep++; draw(); };
  document.getElementById('cPrev').onclick = () => { cStep--; draw(); };
  draw();
}});
