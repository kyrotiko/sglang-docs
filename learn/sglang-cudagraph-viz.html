<body>
<header><h1>SGLang CUDA graph：FullCudaGraphBackend 与 BreakableCudaGraphBackend 是什么、怎么驱动</h1></header>
<nav class="steps" id="nav" aria-label="页面导航"></nav>
<main>
  <h2 id="title" tabindex="-1"></h2>
  <div id="stage"></div>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TABS = [];

// ---------- Tab 1：CUDA graph 到底省了什么（时间线示意） ----------
const KCOL = {gemm:'#2563eb', attn:'#c2410c', misc:'#6b7280', cpuE:'#cbd5e1', cpuG:'#7e22ce'};
const LAYER_OPS = [['norm', 'misc'], ['qkv', 'gemm'], ['rope', 'misc'], ['kv写', 'misc'], ['attn', 'attn'], ['o_proj', 'gemm'], ['norm2', 'misc'], ['mlp', 'gemm']];
const SIZES = {
  decode: {name:'decode（kernel 很短）', d:{embed:3, norm:2, qkv:4, rope:2, 'kv写':2, attn:6, o_proj:3, norm2:2, mlp:8, lm_head:6}},
  short:  {name:'短 prefill（几百 token）', d:{embed:4, norm:3, qkv:10, rope:3, 'kv写':3, attn:12, o_proj:6, norm2:3, mlp:18, lm_head:8}},
  long:   {name:'长 prefill（几千 token）', d:{embed:10, norm:8, qkv:60, rope:10, 'kv写':8, attn:80, o_proj:40, norm2:8, mlp:120, lm_head:20}},
};
const NLAYER = 2, LAUNCH = 8, GLAUNCH = 4;   // µs：eager 每个 kernel 的 CPU 开销 / 一次 graph replay 的 CPU 开销
let tlSize = 'decode';
function buildOps(D) {
  const ops = [{n:'embed', k:'misc', d:D.embed}];
  for (let l = 0; l < NLAYER; l++) LAYER_OPS.forEach(([n, k]) => ops.push({n, k, d:D[n], l}));
  ops.push({n:'lm_head', k:'gemm', d:D.lm_head});
  return ops;
}
function sim(mode, D) {
  const ops = buildOps(D), C = [], G = [];
  let cpu = 0, gpu = 0;
  const eager = op => {
    C.push({s:cpu, e:cpu + LAUNCH, k:'cpuE', t:op.n}); cpu += LAUNCH;
    const s = Math.max(cpu, gpu); G.push({s, e:s + op.d, k:op.k, t:op.n}); gpu = s + op.d;
  };
  const graph = seg => {
    if (!seg.length) return;
    C.push({s:cpu, e:cpu + GLAUNCH, k:'cpuG', t:'replay'}); cpu += GLAUNCH;
    let s = Math.max(cpu, gpu);
    seg.forEach(op => { G.push({s, e:s + op.d, k:op.k, t:op.n}); s += op.d; });
    gpu = s;
  };
  if (mode === 'eager') ops.forEach(eager);
  else if (mode === 'full') graph(ops);
  else {
    // prefill 的 BCG 用法：embed / lm_head 在图外 eager，图内按 attention 切段
    eager(ops[0]);
    let seg = [];
    ops.slice(1, -1).forEach(op => { if (op.k === 'attn') { graph(seg); seg = []; eager(op); } else seg.push(op); });
    graph(seg);
    eager(ops[ops.length - 1]);
  }
  const busy = G.reduce((a, b) => a + (b.e - b.s), 0);
  return {C, G, total:Math.max(cpu, gpu), busy};
}
function laneHtml(name, blocks, scale, width, label) {
  return `<div class="tlrow"><div class="tlname">${name}</div><div class="tllane" style="width:${width}px" role="img" aria-label="${esc(label)}">` +
    blocks.map(b => {
      const w = Math.max(1, (b.e - b.s) * scale);
      const dark = b.k === 'cpuE';
      return `<div class="blk" title="${esc(b.t)} ${(b.e - b.s)}µs" style="left:${b.s * scale}px;width:${w}px;background:${KCOL[b.k]};${dark ? 'color:#111' : ''}">${w > 26 ? esc(b.t) : ''}</div>`;
    }).join('') + '</div></div>';
}
function tlHtml() {
  const D = SIZES[tlSize].d, R = {eager:sim('eager', D), full:sim('full', D), brk:sim('brk', D)};
  const width = 1000, scale = width / Math.max(R.eager.total, R.full.total, R.brk.total);
  const block = (key, title) => {
    const r = R[key], pct = (r.busy / r.total * 100).toFixed(0);
    return laneHtml(title + ' CPU', r.C, scale, width, `${title} CPU 时间线`) +
      laneHtml(title + ' GPU', r.G, scale, width, `${title} GPU 时间线，总耗时约 ${r.total.toFixed(0)} 微秒，GPU 忙碌 ${pct}%`) +
      `<div class="tlsum">总耗时 ≈ <b>${r.total.toFixed(0)} µs</b>，GPU 忙碌 ${pct}%，CPU 发起了 ${r.C.length} 次提交</div>`;
  };
  return block('eager', 'Eager') + block('full', 'Full graph') + block('brk', 'Breakable');
}
TABS.push({nav:'① CUDA graph 省了什么', title:'① 先把基础补上：CUDA graph 到底省掉了什么',
render(){
  return `<div class="desc">GPU kernel 都是 CPU 一个一个"提交"的。eager 模式下，每个算子都要走一遍 Python → PyTorch dispatcher → CUDA launch，CPU 上要花几到十几微秒。
    一层 Llama 有十来个 kernel，32 层一次前向就是几百次提交。<b>kernel 很短的时候（decode），GPU 算完一个就在等 CPU 提交下一个</b>，时间都花在了"等"上。<br>
    CUDA graph 的做法是：启动时把一整串 kernel（连同参数和显存地址）<b>录制</b>下来；运行时 CPU 只调用一次 <code>graph.replay()</code>，GPU 就把录好的 kernel 背靠背跑完。<br>
    下面用一个 2 层的玩具模型示意三种驱动方式。切换 kernel 大小，看 GPU 什么时候在空等。</div>
    <div class="bar" role="group" aria-label="kernel 大小">${Object.entries(SIZES).map(([k, s]) =>
      `<button data-sz="${k}" aria-pressed="${k === tlSize}">${s.name}</button>`).join('')}</div>
    <div class="legend"><span><i style="background:${KCOL.cpuE}"></i>CPU 提交一个 kernel</span><span><i style="background:${KCOL.cpuG}"></i>CPU 发起一次 graph replay</span>
      <span><i style="background:${KCOL.gemm}"></i>GEMM</span><span><i style="background:${KCOL.attn}"></i>attention</span><span><i style="background:${KCOL.misc}"></i>其他小 kernel</span></div>
    <div class="tlwrap" id="tl"></div>
    <p class="note">数字是示意值：eager 每个 kernel 的 CPU 开销按 ${LAUNCH} µs、每次 replay 按 ${GLAUNCH} µs 算，忽略了 load_batch、metadata 准备等每个 batch 一次的开销。真实模型有几十层，差距会成倍放大。
    Breakable 这一行按 prefill 的用法画：embed 和 lm_head 在图外 eager，attention 在图的两段之间 eager。</p>
    <h3>录制这件事带来的硬约束</h3>
    <p>• <b>地址固定</b>：录下来的是"从地址 X 读、往地址 Y 写"。所以每次 replay 前要把这次的输入拷进录制时用的那块静态 buffer。<br>
    • <b>形状固定</b>：kernel 的 grid 大小录死了。所以要对一组 batch size（或 token 数）分别录一张图，运行时向上补齐到最近的档位。<br>
    • <b>图里不能有 CPU 逻辑</b>：图里没有 Python，if/for 只在录制那一次执行。依赖这次数据的 CPU 决策（比如按每个请求的长度规划 attention）必须放到图外，或者提前写进静态 buffer。</p>
    <p>第三条正是两种 backend 的分歧点：attention 恰好是那块"最依赖这次 batch 长什么样"的计算。</p>`;
},
after(){
  const draw = () => document.getElementById('tl').innerHTML = tlHtml();
  document.querySelectorAll('[data-sz]').forEach(b => b.onclick = () => {
    tlSize = b.dataset.sz;
    document.querySelectorAll('[data-sz]').forEach(x => x.setAttribute('aria-pressed', x === b));
    draw();
  });
  draw();
}});
// ---------- Tab 2：架构图 ----------
const AC = {mr:'#7e22ce', run:'#b45309', base:'#475569', full:'#2563eb', brk:'#c2410c', eager:'#6b7280', graph:'#0e7490', pool:'#15803d', attn:'#be185d'};
const ARCH = {
  mr:{c:AC.mr, t:'ModelRunner._forward_raw', s:'model_runner.py:1958', d:`每次前向在这里选路径：
    <br>• decode 且 <code>decode_cuda_graph_runner.can_run_graph(fb)</code> → <code>decode_cuda_graph_runner.execute</code>（<span class="loc">2001</span>）
    <br>• extend 且 prefill runner 能跑 → <code>prefill_cuda_graph_runner.execute</code>（<span class="loc">2031–2054</span>）
    <br>• 否则 → <code>eager_runner.execute</code>（<span class="loc">2058</span>）
    <br>三个 runner 都在启动时由 <code>init_cuda_graphs</code> 创建（<span class="loc">1165–1197</span>）。`},
  dec:{c:AC.run, t:'DecodeCudaGraphRunner', s:'runner/decode_cuda_graph_runner.py:219', d:`<b>管 decode 阶段"录什么、怎么喂数据"</b>，不管"怎么录"。
    <br>• 持有静态 buffer（input_ids、positions、seq_lens、out_cache_loc…）和要录的 batch size 列表。
    <br>• <code>capture()</code>：bs 从大到小，对每个 bs 调 <code>capture_one_shape</code>，里面构造 <code>run_once</code>（= 整个 model.forward，含 logits）交给 <code>self.backend.capture_one</code>（<span class="loc">1109–1360</span>）。
    <br>• <code>execute()</code>：<code>load_batch</code> 把这次输入拷进静态 buffer、补齐到录制的 bs、在图外刷新 attention metadata（<span class="loc">1575</span>）→ <code>self.backend.replay</code> → 按真实 bs 切片输出（<span class="loc">1598–1660</span>）。`},
  pre:{c:AC.run, t:'PrefillCudaGraphRunner', s:'runner/prefill_cuda_graph_runner.py:289', d:`<b>管 prefill 阶段</b>，按 token 数分档（bucket）录制。
    <br>• 只录 transformer 的<b>层主体</b>：embedding 在图外算好拷进静态 slot，LM head + logits_processor 在图外 eager 跑（<span class="loc">2166–2237</span>）。replay 时把 <code>layer_model.forward</code> 临时换成 <code>replay_layer_forward</code>。
    <br>• <code>can_run_graph</code> 检查 token 数、最长序列、LoRA、多模态、mixed batch 等，不满足就走 eager（<span class="loc">1414</span>）。`},
  eag:{c:AC.eager, t:'EagerRunner', s:'runner/eager_runner.py:81', d:'不录图，逐个 kernel 提交。所有走不了图的情况都回落到这里。'},
  base:{c:AC.base, t:'BaseCudaGraphBackend（接口）', s:'runner_backend/base_cuda_graph_backend.py:28', d:`runner 手里的 <code>self.backend</code>，负责<b>"怎么录、怎么放"</b>。接口只有 6 个方法：
    <code>capture_session(stream)</code> / <code>capture_one(shape_key, forward_fn, …)</code> / <code>can_run</code> / <code>replay_session()</code> / <code>replay(shape_key, fb)</code> / <code>cleanup</code>。
    <br>由 <code>resolve_decode_backend</code> / <code>resolve_prefill_backend</code> 按配置创建（<span class="loc">runner_backend/utils.py:48 / 107</span>）。`},
  full:{c:AC.full, t:'FullCudaGraphBackend', s:'runner_backend/full_cuda_graph_backend.py:99', d:`<b>一个 shape 录一张完整的图</b>，attention 也在图里。
    <br>• <code>capture_one</code>：先 eager 跑 2 次 warmup（加载 kernel、autotune、懒初始化），再在 <code>torch.cuda.graph(graph, pool, stream)</code> 里跑一次 forward_fn 录下来，存 <code>_graphs[key]</code> 和 <code>_outputs[key]</code>（<span class="loc">137–216</span>）。
    <br>• <code>replay</code>：<code>_graphs[key].replay()</code>，返回录制时那块输出 tensor（<span class="loc">225–233</span>）。
    <br>• 图里的 attention kernel 读的是固定地址的 metadata buffer，runner 每次 replay 前往里写新值。`},
  brk:{c:AC.brk, t:'BreakableCudaGraphBackend', s:'runner_backend/breakable_cuda_graph_backend.py:60', d:`<b>一个 shape 录成"多段图 + 段间 eager 函数"</b>，attention 在段与段之间 eager 跑。
    <br>• <code>capture_one</code>：2 次 warmup，然后在 <code>BreakableCUDAGraphCapture</code> 里跑 forward_fn；碰到 <code>@eager_on_graph</code> 标记的函数就在那里断开（<span class="loc">113–159</span>）。
    <br>• <code>replay_session</code> 打开 <code>enable_breakable_cuda_graph()</code> 标志，RadixAttention 据此走 eager 分支（<span class="loc">256–259</span>）。
    <br>• 不支持 memory saver（<span class="loc">88–94</span>）；混入 DedupedCudaGraphMixin，结构相同的段可以复用同一份可执行图（<span class="loc">cuda_graph_dedup_mixin.py</span>，基于 cudaGraphExecUpdate）。`},
  g1:{c:AC.graph, t:'torch.cuda.CUDAGraph × 每个 shape 一张', s:'_graphs: Dict[ShapeKey, CUDAGraph]', d:'Full 的产物：每个 batch size（decode）或 token 档（prefill）一张完整的图。'},
  g2:{c:AC.graph, t:'BreakableCUDAGraph × 每个 shape 一个', s:'breakable_cuda_graph.py:329', d:`Breakable 的产物：<code>_segments</code>（若干 CUDAGraph）和 <code>_break_fns</code>（段间要 eager 执行的函数）。
    <br><code>replay()</code> 就是 <code>for i, seg: seg.replay(); break_fns[i]()</code>（<span class="loc">338–347</span>）。`},
  pool:{c:AC.pool, t:'全局 graph memory pool', s:'runner_utils/pool.py get_or_create_global_graph_memory_pool', d:'所有图共用一个显存池存放中间结果。录制时 bs 从大到小（<span class="loc">decode_cuda_graph_runner.py:1150–1152、1184–1186</span>），小图可以复用大图已经申请的显存，总占用接近"最大那张图"而不是"所有图之和"。'},
  attn:{c:AC.attn, t:'AttentionBackend（另一个 "backend"！）', s:'layers/attention/*_backend.py', d:`和上面的 CUDA graph backend 是两回事，两者配合：
    <br>• <b>Full（decode）</b>：replay 前 runner 调 <code>init_forward_metadata_out_graph</code> 把这次的 kv_indices 等写进静态 buffer；attention kernel 本身录在图里。
    <br>• <b>Breakable（prefill）</b>：replay 前在图外调 <code>init_forward_metadata</code>（<span class="loc">prefill_cuda_graph_runner.py:1291–1292</span>）；每层的 attention 由 <code>RadixAttention._eager_attention</code>（<span class="loc">radix_attention.py:176</span>）在段间 eager 调 <code>get_attn_backend().forward</code>，用的是这次真实的 batch。`},
};
const abox = (id, cls = '') => `<button class="abox ${cls}" data-a="${id}" style="--c:${ARCH[id].c}"><b>${esc(ARCH[id].t)}</b><small>${esc(ARCH[id].s)}</small>${
  id === 'full' ? '<br><span class="tag">decode 默认</span>' : id === 'brk' ? '<br><span class="tag">prefill 默认（CUDA）</span>' : ''}</button>`;
TABS.push({nav:'② 架构图', title:'② 架构：Runner 管"录什么、怎么喂"，Backend 管"怎么录、怎么放"（点击方框看说明）',
render(){
  return `<div class="cols" style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
    <div class="arch" style="flex:1.5;min-width:640px">
      <div class="span3">${abox('mr')}</div>
      <div class="down span3">↓ 按 forward_mode 和能否走图，三选一</div>
      ${abox('dec')}${abox('pre')}${abox('eag')}
      <div class="down span2" style="grid-column:1/3">↓ self.backend（两个 runner 都可以配成任一种）</div><div></div>
      <div style="grid-column:1/3">${abox('base')}</div><div class="note" style="align-self:center">EagerRunner 没有 graph backend</div>
      ${abox('full')}${abox('brk')}<div></div>
      <div class="down">↓ 产物</div><div class="down">↓ 产物</div><div></div>
      ${abox('g1')}${abox('g2')}<div></div>
      <div style="grid-column:1/3">${abox('pool')}</div><div></div>
      <div class="span3">${abox('attn', 'dash')}</div>
    </div>
    <div class="info" id="archInfo" aria-live="polite" style="flex:1;min-width:320px;position:sticky;top:10px"></div></div>
    <div class="warn">注意名字：这里的 <b>CUDA graph backend</b>（Full / Breakable）决定"怎么录制和回放前向"；之前讲的 <b>AttentionBackend</b>（flashinfer / fa3 / triton…）决定"attention 用哪个 kernel 算"。两个"backend"互相独立，可以任意组合。<br>

},

    <tr><th>attention metadata</th><td>replay 前写进固定地址的 buffer，图里的 kernel 读它。所以"有几个请求"也被录死了：prefill 要固定请求槽位数，空的槽位用长度为 0 的占位补齐</td><td>replay 前在图外按这次真实的 batch 正常计算，attention 本身也是 eager，不需要补齐请求数</td></tr>

  </table>
  <h3>为什么 decode 默认 Full、prefill 默认 Breakable</h3>
  <p>CUDA graph 要求"形状和地址录死"。<b>一个 batch 里，只有 attention 关心 token 是怎么分给各个请求的</b>（几个请求、各自多长、前缀命中多少）。
  qkv_proj、RoPE、MLP、norm 这些逐 token 的算子只关心总 token 数（之前讲过的"按行独立"）。</p>
  <p>• <b>decode</b>：每个请求正好 1 个 token，batch size 一确定，attention 的 grid 形状也就确定了，只有每个请求的 KV 长度会变，而这只是 metadata buffer 里的数值。所以整个前向录成一张图没有问题，CPU 开销最小。<br>
  • <b>prefill</b>：同样 2048 个 token，可能是 1 个请求 × 2048，也可能是 16 个请求 × 128，attention 的切分方式完全不同。Full 只能把请求槽位数也录死再补齐；Breakable 干脆把 attention 拿出图外 eager 跑，其余只按 token 数分档录制。</p>
  <p>这也是之前那张"一层 attention 拆解"里 5–8 步（交给 backend → 写 KV → attention kernel）和其余步骤的区别：Breakable 断开的就是这一段。</p>
  <h3>默认值和配置</h3>
  <p>• 默认：decode = <code>full</code>（<span class="loc">cuda_graph_config.py:149–151</span>）；prefill 在 CUDA 上 = <code>breakable</code>，其他平台 = <code>disabled</code>（<span class="loc">cuda_graph_config.py:119–123</span>）。<br>
  • 命令行：<code>--cuda-graph-backend-decode</code> / <code>--cuda-graph-backend-prefill</code>，取值 <code>full | breakable | disabled</code>；或者 <code>--cuda-graph-config '{"decode":{"backend":"full","max_bs":256},"prefill":{"backend":"breakable"}}'</code>（JSON 优先级最高）。<br>
  • 相关：<code>--cuda-graph-max-bs-decode</code>、<code>--cuda-graph-max-bs-prefill</code>、<code>--cuda-graph-max-seq-len-prefill</code>（更长的 batch 走 eager）、<code>--disable-decode-cuda-graph</code>、<code>--disable-prefill-cuda-graph</code>（<span class="loc">arg_groups/fields/exec_.py:572–640</span>）。</p>

    <tr><td>attention kernel 从哪读 KV 长度</td><td>从<b>设备上固定地址的 buffer</b>读（kv_indptr 等的数值）</td><td>启动时由 <b>host 传入的输入属性</b>：MLA 叫 <code>actual_seq_lengths_kv</code>，MHA 叫 <code>context_lens</code>，投机验证叫 <code>actual_seq_kvlen</code>（<span class="loc">npu_graph_runner.py:139 _init_arch_map</span>）</td></tr>
    <tr><td>replay 前要做什么</td><td>CPU 把新值写进那块 buffer（<code>init_forward_metadata_out_graph</code>），<b>图本身不用动</b></td><td>不写 buffer，调 CANN 的 <code>NPUGraph.update(cpu_update_input=[{attr: seq_lens}])</code> <b>重新绑定图的 host 输入</b>，再 replay（<span class="loc">npu_cudagraph_backend.py:156</span>）</td></tr>
    <tr><td>调用入口</td><td><code>backend.replay(shape_key, fb)</code></td><td>NPUGraphRunner.execute 重写后走 <code>backend.replay_with_input_update(...)</code>（<span class="loc">npu_graph_runner.py:418</span>）；补齐槽位的 seq_lens 填 0</td></tr>
  </table>
  <p>工程细节：<code>update</code> 提交给一个专用 worker 线程与 replay 并发发起，随后 <code>update_future.result()</code> 等完成；因为 seq_lens 是 host 侧数组、设备可能还在读上一轮，有 <code>_rebind_fence</code> 事件保证下一轮重写前先等上一轮读完（<span class="loc">npu_cudagraph_backend.py:68–76 / 182–193</span>）。
  特例：DeepSeek DSA / V4 走 sync-free 路径，直接 <code>backend.replay</code> 不做 update（<span class="loc">npu_graph_runner.py:372–425</span>）。</p>
  <h3>其余小差异</h3>
  <table class="cmp">
    <tr><th>项</th><th>DecodeCudaGraphRunner</th><th>NPUGraphRunner</th></tr>
    <tr><td>torch.compile</td><td>默认 patch</td><td>换成 <code>patch_model_npu</code>，走 torch_npu 的 <code>npugraph_ex</code> 后端——昇腾的 "compile + 整图" 是配套设计（<span class="loc">npu_graph_runner.py:78–94</span>）</td></tr>
    <tr><td>out_cache_loc dtype</td><td>int64</td><td>int32（省带宽，<code>_cache_loc_dtype</code>）</td></tr>
    <tr><td>capture profiler</td><td>内存里出 trace</td><td>写磁盘（<code>_init_profile_context_and_memory_record</code> 重写）</td></tr>
    <tr><td>可选 backend</td><td>full / breakable / disabled</td><td>只有 full-style 一种</td></tr>
    <tr><td>专属分支</td><td>—</td><td>ASCEND_USE_FIA、FIA v2 BSND 等 NPU kernel 开关；另有 eagle_draft 等 NPU 子类给投机解码 draft 用（同套路：继承 CUDA 侧对应 runner，只换录制 API 和 seq_lens 更新）</td></tr>
  </table>`;
}});

let cur = 0;
const nav = document.getElementById('nav');
nav.innerHTML = TABS.map((s, i) => `<button data-i="${i}">${esc(s.nav)}</button>`).join('');
nav.querySelectorAll('button').forEach(b => b.onclick = () => go(+b.dataset.i));
function go(i) {
  cur = i;
  const s = TABS[cur];
  document.getElementById('title').textContent = s.title;
  document.getElementById('stage').innerHTML = s.render();
  if (s.after) s.after();
  nav.querySelectorAll('button').forEach((b, j) =>
    j === cur ? b.setAttribute('aria-current', 'step') : b.removeAttribute('aria-current'));
}
go(0);
</script>
